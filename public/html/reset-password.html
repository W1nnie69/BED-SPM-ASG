<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>

  <div class="card">
    <h1>Set a new password</h1>
    <p class="subtitle">Your new password must be different from your previous password.</p>

    <div class="success-message" id="successMessage">
      Your password has been reset. You can now log in with your new password.
    </div>

    <div class="error-message" id="errorMessage">
      Passwords do not match. Please try again.
    </div>

    <form id="resetPasswordForm">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" name="newPassword" placeholder="Enter your new password" required>
      <p class="hint">Use at least 8 characters</p>

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password" required>

      <button type="submit">Reset password</button>
    </form>

    <p class="back-link">Remembered your password? <a href="login.html">Log in</a></p>
  </div>

  <script src="../js/reset-password.js"></script>

</body>
</html>
