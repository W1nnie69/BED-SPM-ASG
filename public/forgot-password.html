<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f4f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  .card h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: #1f2937;
  }

  .card p.subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  button {
    width: 100%;
    padding: 11px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #4338ca;
  }

  .back-link {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-top: 20px;
  }

  .back-link a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 600;
  }

  .success-message {
    display: none;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #065f46;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 18px;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Reset your password</h1>
    <p class="subtitle">Enter the email linked to your account and we will send you a link to reset your password.</p>

    <div class="success-message" id="successMessage">
      Check your inbox. We just sent a reset link to your email.
    </div>

    <form id="resetForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <button type="submit">Send reset link</button>
    </form>

    <p class="back-link">Remembered your password? <a href="login.html">Log in</a></p>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('successMessage').style.display = 'block';
      document.getElementById('resetForm').reset();

      // In a real app, this page would only move forward once the user
      // clicks the reset link sent to their email. For this demo, we just
      // move to the next page after a short pause.
      setTimeout(function() {
        window.location.href = 'reset-password.html';
      }, 1500);
    });
  </script>

</body>
</html>
