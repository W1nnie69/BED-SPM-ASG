<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f4f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  .card h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: #1f2937;
  }

  .card p.subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    color: #6b7280;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 20px;
    color: #6b7280;
  }

  .options a {
    color: #4f46e5;
    text-decoration: none;
  }

  button {
    width: 100%;
    padding: 11px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #4338ca;
  }

  .signup {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-top: 20px;
  }

  .signup a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account to continue</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <div class="options">
        <label style="display:flex; align-items:center; gap:6px; font-weight:normal; margin:0;">
          <input type="checkbox" style="width:auto; margin:0;"> Remember me
        </label>
        <a href="/forgot-password">Forgot password?</a>
      </div>

      <button type="submit">Log in</button>
    </form>

    <p class="signup">Don't have an account? <a href="/signup">Sign up</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Login form submitted (this is just a demo, no real login yet).');
    });
  </script>

</body>
</html>
