<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage menu</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { max-width: 760px; }
    .row {
      display: grid;
      grid-template-columns: 50px 90px 1fr 90px 110px 140px;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .row input {
      width: 100%;
    }
    .row.header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      border-bottom: 2px solid #ccc;
    }
    .row button {
      margin: 0;
      padding: 6px 10px;
      font-size: 0.8rem;
    }
    .row .save-btn { background: #1a7a3d; }
    .row .save-btn:hover { background: #16612f; }
    .row .delete-btn { background: #a33; }
    .row .delete-btn:hover { background: #822; }
    .row .save-btn[disabled], .row .delete-btn[disabled] {
      display: none;
    }
    .stall-picker {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      margin-bottom: 8px;
    }
    .stall-picker > div { flex: 1; }
    .stall-picker button { margin-top: 0; }
    .add-row {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 2px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Manage menu</h1>
  <p class="subtitle">
    Full CRUD test client for <code>/api/stall/:stallId/menu</code>.
    Add/edit/delete require a logged-in session that owns the stall
    (via <code>RentalAgreement</code>) — otherwise you'll see 401/403 below.
  </p>

  <div class="stall-picker">
    <div>
      <label for="stallId">Stall ID</label>
      <input type="text" id="stallId" value="ST001">
    </div>
    <button id="loadBtn">Load menu</button>
  </div>

  <div id="topMessage" class="message"></div>

  <div id="menuList"></div>

  <div class="add-row">
    <h3>Add new item</h3>

    <div id="loginRequiredNotice" class="message error" style="display:none">
      You need to <a href="/login">log in</a> as the owner of this stall to add items.
    </div>

    <form id="addForm" style="display:none">
      <label for="newCode">Item code</label>
      <input type="text" id="newCode" placeholder="IT099" required>

      <label for="newDesc">Description</label>
      <input type="text" id="newDesc" required>

      <label for="newPrice">Price</label>
      <input type="number" step="0.01" id="newPrice" required>

      <label for="newCategory">Category</label>
      <input type="text" id="newCategory" required>

      <label for="newPhoto">Photo (optional)</label>
      <input type="file" id="newPhoto" accept="image/jpeg,image/png,image/webp">

      <button type="submit">Add item</button>
    </form>
    <div id="addMessage" class="message"></div>
  </div>

  <div class="links">
    <a href="/dash">Back to dashboard</a>
  </div>

  <script>
    const stallIdInput = document.getElementById("stallId");
    const loadBtn = document.getElementById("loadBtn");
    const topMessage = document.getElementById("topMessage");
    const menuList = document.getElementById("menuList");
    const addForm = document.getElementById("addForm");
    const addMessage = document.getElementById("addMessage");
    const loginRequiredNotice = document.getElementById("loginRequiredNotice");

    let isLoggedIn = false;
    let ownsCurrentStall = false;

    function showMessage(el, text, type) {
      el.textContent = text;
      el.className = "message show " + type;
    }

    function clearMessage(el) {
      el.className = "message";
    }

    function menuUrl(extra = "") {
      const stallId = stallIdInput.value.trim();
      return `/api/stall/${encodeURIComponent(stallId)}/menu${extra}`;
    }

    // ---- Check session status ----
    async function checkSession() {
      try {
        const res = await fetch("/api/session");
        const data = await res.json();
        isLoggedIn = !!data.loggedIn;
      } catch (err) {
        isLoggedIn = false;
      }
    }

    // ---- Check whether the logged-in user owns the currently selected stall ----
    async function checkOwnership() {
      ownsCurrentStall = false;

      if (!isLoggedIn) {
        addForm.style.display = "none";
        loginRequiredNotice.style.display = "block";
        loginRequiredNotice.innerHTML = `You need to <a href="/login">log in</a> to add items.`;
        return;
      }

      try {
        const stallId = stallIdInput.value.trim();
        const res = await fetch(`/api/stall/${encodeURIComponent(stallId)}/owns`);
        const data = await res.json();

        ownsCurrentStall = !!data.owns;

        if (ownsCurrentStall) {
          addForm.style.display = "flex";
          loginRequiredNotice.style.display = "none";
        } else {
          addForm.style.display = "none";
          loginRequiredNotice.style.display = "block";
          loginRequiredNotice.innerHTML = `You don't own this stall, so you can't add items to it.`;
        }
      } catch (err) {
        ownsCurrentStall = false;
        addForm.style.display = "none";
        loginRequiredNotice.style.display = "block";
        loginRequiredNotice.innerHTML = `Couldn't verify stall ownership — try reloading.`;
      }
    }

    async function loadMenu() {
      clearMessage(topMessage);
      menuList.innerHTML = "";

      try {
        const res = await fetch(menuUrl());
        const data = await res.json();

        if (!res.ok) {
          showMessage(topMessage, `${res.status}: ${data.error || "Failed to load menu."}`, "error");
          return;
        }

        if (data.length === 0) {
          showMessage(topMessage, "No menu items for this stall yet. Add one below.", "success");
          return;
        }

        renderRows(data);
      } catch (err) {
        showMessage(topMessage, "Could not reach the server: " + err.message, "error");
      }
    }

    function renderRows(items) {
      const header = document.createElement("div");
      header.className = "row header";
      header.innerHTML = `<div>Photo</div><div>Code</div><div>Description</div><div>Price</div><div>Category</div><div>Actions</div>`;
      menuList.appendChild(header);

      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "row";

        const thumb = item.ImagePath
          ? `<img src="${item.ImagePath}" alt="${item.ItemDesc}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;">`
          : `<div style="width:40px;height:40px;background:#eee;border-radius:4px;"></div>`;

        // Save/Delete only rendered as active controls when logged in —
        // they'll still fail server-side with 401/403 if session state
        // changes mid-page, but there's no point showing them otherwise.
        const actions = ownsCurrentStall
          ? `<button class="save-btn">Save</button><button class="delete-btn">Delete</button>`
          : `<span class="pill">Not your stall</span>`;

        row.innerHTML = `
          <div>${thumb}</div>
          <div>${item.ItemCode}</div>
          <input type="text" class="edit-desc" value="${item.ItemDesc}" ${ownsCurrentStall ? "" : "disabled"}>
          <input type="number" step="0.01" class="edit-price" value="${item.ItemPrice}" ${ownsCurrentStall ? "" : "disabled"}>
          <input type="text" class="edit-category" value="${item.ItemCategory}" ${ownsCurrentStall ? "" : "disabled"}>
          <div>${actions}</div>
        `;

        if (ownsCurrentStall) {
          row.querySelector(".save-btn").addEventListener("click", () => updateItem(item.ItemCode, row));
          row.querySelector(".delete-btn").addEventListener("click", () => deleteItem(item.ItemCode, row));
        }

        menuList.appendChild(row);
      });
    }

    async function updateItem(code, row) {
      clearMessage(topMessage);

      const payload = {
        ItemDesc: row.querySelector(".edit-desc").value,
        ItemPrice: parseFloat(row.querySelector(".edit-price").value),
        ItemCategory: row.querySelector(".edit-category").value
      };

      try {
        const res = await fetch(menuUrl(`/${encodeURIComponent(code)}`), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          showMessage(topMessage, `${code} updated.`, "success");
        } else {
          showMessage(topMessage, `${res.status}: ${data.error || "Update failed."}`, "error");
        }
      } catch (err) {
        showMessage(topMessage, "Could not reach the server: " + err.message, "error");
      }
    }

    async function deleteItem(code, row) {
      clearMessage(topMessage);

      if (!confirm(`Delete item ${code}?`)) return;

      try {
        const res = await fetch(menuUrl(`/${encodeURIComponent(code)}`), {
          method: "DELETE"
        });

        const data = await res.json();

        if (res.ok) {
          showMessage(topMessage, `${code} deleted.`, "success");
          row.remove();
        } else {
          showMessage(topMessage, `${res.status}: ${data.error || "Delete failed."}`, "error");
        }
      } catch (err) {
        showMessage(topMessage, "Could not reach the server: " + err.message, "error");
      }
    }

    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage(addMessage);

      const formData = new FormData();
      formData.append("itemCode", document.getElementById("newCode").value);
      formData.append("ItemDesc", document.getElementById("newDesc").value);
      formData.append("ItemPrice", document.getElementById("newPrice").value);
      formData.append("ItemCategory", document.getElementById("newCategory").value);

      const photoFile = document.getElementById("newPhoto").files[0];
      if (photoFile) {
        formData.append("photo", photoFile);
      }

      try {
        // No Content-Type header here — the browser sets the correct
        // multipart/form-data boundary automatically when using FormData.
        const res = await fetch(menuUrl(), {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          showMessage(addMessage, data.message || "Item added.", "success");
          addForm.reset();
          loadMenu();
        } else {
          showMessage(addMessage, `${res.status}: ${data.error || "Add failed."}`, "error");
        }
      } catch (err) {
        showMessage(addMessage, "Could not reach the server: " + err.message, "error");
      }
    });

    loadBtn.addEventListener("click", () => {
      checkOwnership();
      loadMenu();
    });

    // check session once, then check ownership + load the default stall's menu
    checkSession().then(() => {
      checkOwnership();
      loadMenu();
    });
  </script>
</body>
</html>
