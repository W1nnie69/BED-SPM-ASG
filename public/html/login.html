<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Login</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="card">
    <div class="brand-row">
      <a href="/" class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10L12 4L20 10V19C20 19.5523 19.5523 20 19 20H5C4.44772 20 4 19.5523 4 19V10Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9 20V14H15V20" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1>Hawker Centre Portal</h1>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Log in to your account to continue</p>

    <div class="banner error" id="errorBanner"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a href="/forgot-password">Forgot password?</a>
      </div>

      <button type="submit">Log in</button>
    </form>

    <p class="signup">Don't have an account? <a href="/signup">Sign up</a></p>
  </div>

  <script src="../js/login.js"></script>

</body>
</html>
