<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>

  <div class="card">
    <h1>Reset your password</h1>
    <p class="subtitle">Enter the email linked to your account and we will send you a link to reset your password.</p>

    <div class="success-message" id="successMessage">
      Check your inbox. We just sent a reset link to your email.
    </div>

    <form id="resetForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <button type="submit">Send reset link</button>
    </form>

    <p class="back-link">Remembered your password? <a href="login.html">Log in</a></p>
  </div>

  <script src="../js/forgot-password.js"></script>

</body>
</html>
