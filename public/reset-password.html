<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f4f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  .card h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: #1f2937;
  }

  .card p.subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .hint {
    font-size: 12px;
    color: #9ca3af;
    margin: -12px 0 18px;
  }

  button {
    width: 100%;
    padding: 11px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #4338ca;
  }

  .back-link {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-top: 20px;
  }

  .back-link a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 600;
  }

  .success-message {
    display: none;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #065f46;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 18px;
  }

  .error-message {
    display: none;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 18px;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Set a new password</h1>
    <p class="subtitle">Your new password must be different from your previous password.</p>

    <div class="success-message" id="successMessage">
      Your password has been reset. You can now log in with your new password.
    </div>

    <div class="error-message" id="errorMessage">
      Passwords do not match. Please try again.
    </div>

    <form id="resetPasswordForm">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" name="newPassword" placeholder="Enter your new password" required>
      <p class="hint">Use at least 8 characters</p>

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password" required>

      <button type="submit">Reset password</button>
    </form>

    <p class="back-link">Remembered your password? <a href="login.html">Log in</a></p>
  </div>

  <script>
    document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');

      if (newPassword !== confirmPassword) {
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        return;
      }

      errorMessage.style.display = 'none';
      successMessage.style.display = 'block';
      document.getElementById('resetPasswordForm').reset();
    });
  </script>

</body>
</html>
