<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Hawker Centre Portal</title>
<link rel="stylesheet" href="css/index.css">
</head>
<body>

  <div class="wrap">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 10L12 4L20 10V19C20 19.5523 19.5523 20 19 20H5C4.44772 20 4 19.5523 4 19V10Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 20V14H15V20" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Hawker Centre Portal</h1>
    <p class="subtitle" id="subtitle">Checking your session...</p>

    <div class="options" id="options" style="display:none;">
      <a class="option-card" href="/login">
        <div class="option-icon login">🔑</div>
        <div class="option-text">
          <h3>Log In</h3>
          <p>Stall owners, operators, and customers</p>
        </div>
      </a>

      <a class="option-card" href="/signup">
        <div class="option-icon signup">✍️</div>
        <div class="option-text">
          <h3>Sign Up</h3>
          <p>Create a new account</p>
        </div>
      </a>

      <a class="option-card" href="/order">
        <div class="option-icon guest">🍜</div>
        <div class="option-text">
          <h3>Browse as Guest</h3>
          <p>See the menu, no account needed</p>
        </div>
      </a>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
