<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f5f0e8;
      --ink: #1a1612;
      --accent: #c8432a;
      --muted: #8a7f74;
      --border: #d6cfc4;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }

    .login-wrap {
      display: flex;
      width: 860px;
      min-height: 520px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 8px 8px 0px var(--ink);
    }

    /* Left panel */
    .login-panel-left {
      width: 42%;
      background-color: var(--ink);
      padding: 52px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .login-panel-left::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 60px solid rgba(200, 67, 42, 0.15);
      bottom: -100px;
      right: -100px;
    }

    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .left-tagline {
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .left-quote {
      font-family: 'DM Serif Display', serif;
      color: #fff;
      font-size: 1.55rem;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .left-quote::before {
      content: '\201C';
      color: var(--accent);
      font-size: 3rem;
      line-height: 0;
      vertical-align: -0.4em;
      margin-right: 4px;
    }

    /* Right panel */
    .login-panel-right {
      flex: 1;
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-heading {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .login-sub {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 32px;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-control {
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      padding: 10px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      background: #fff;
      outline: none;
    }

    .form-control::placeholder {
      color: #c4bdb5;
    }

    .forgot-link {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover { color: var(--accent); }

    .btn-login {
      background-color: var(--ink);
      color: #fff;
      border: none;
      border-radius: 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 13px;
      width: 100%;
      margin-top: 28px;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      box-shadow: 4px 4px 0 var(--accent);
    }

    .btn-login:hover {
      background-color: var(--accent);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .btn-login:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .signup-link {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 16px;
    }

    .signup-link a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .signup-link a:hover { color: var(--accent); }

    @media (max-width: 700px) {
      .login-wrap { flex-direction: column; width: 95%; box-shadow: 4px 4px 0 var(--ink); }
      .login-panel-left { width: 100%; min-height: 160px; padding: 32px 28px; }
      .left-quote { font-size: 1.2rem; }
      .login-panel-right { padding: 36px 28px; }
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <!-- Left -->
    <div class="login-panel-left">
      <div>
        <div class="brand">my<span>app</span></div>
        <div class="left-tagline">Welcome back</div>
      </div>
      <div class="left-quote">
        Simple tools for people who mean business.
      </div>
    </div>

    <!-- Right -->
    <div class="login-panel-right">
      <div class="login-heading">Sign in</div>
      <div class="login-sub">Enter your credentials to continue.</div>

      <form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="you@example.com">
        </div>

        <div class="mb-1">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="••••••••">
        </div>

        <div class="text-end mt-2">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="divider">or</div>

      <div class="signup-link">
        Don't have an account? <a href="#">Create one</a>
      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;

            const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                window.location.href = '/home'; // redirect on success
            } else {
                alert(data.message || 'Login failed');
            }
        });
    </script>
</body>
</html>
