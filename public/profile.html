<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>My Profile</title>
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --ink: #22201d;
    --ink-soft: #6f6a62;
    --line: #eae6dd;
    --teal: #0f6e6e;
    --teal-dark: #0a4f4f;
    --teal-tint: #e4f2f1;
    --spice: #d9822b;
    --spice-tint: #fbeddc;
    --chili: #c8553d;
    --chili-tint: #f8e6e1;
    --radius-lg: 18px;
    --radius-md: 12px;
    --shadow-card: 0 1px 2px rgba(34, 32, 29, 0.04), 0 10px 30px -12px rgba(34, 32, 29, 0.12);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 100% -10%, rgba(15, 110, 110, 0.06), transparent 60%),
      var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--teal-tint);
    color: var(--teal-dark);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    background: var(--surface);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px -4px rgba(15, 110, 110, 0.5);
  }

  .brand-mark svg {
    width: 19px;
    height: 19px;
  }

  .topbar h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .topbar .sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 1px 0 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    padding: 9px 16px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .back-btn::before {
    content: '';
    width: 6px;
    height: 6px;
    border-left: 1.6px solid currentColor;
    border-bottom: 1.6px solid currentColor;
    transform: rotate(45deg);
    opacity: 0.7;
  }

  .back-btn:hover {
    background: var(--bg);
    border-color: #ddd7c9;
  }

  .logout-btn {
    padding: 9px 18px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .logout-btn:hover {
    background: var(--chili);
  }

  .logout-btn:active {
    transform: scale(0.97);
  }

  /* ---------- Layout ---------- */
  .container {
    max-width: 680px;
    margin: 32px auto 64px;
    padding: 0 24px;
  }

  .greeting {
    margin-bottom: 28px;
  }

  .greeting h2 {
    font-family: 'Fraunces', Georgia, serif;
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.015em;
  }

  .greeting p {
    margin: 0;
    font-size: 14.5px;
    color: var(--ink-soft);
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 28px 30px;
    margin-bottom: 22px;
    border: 1px solid var(--line);
  }

  .card-header {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .card-header h3 {
    margin: 0 0 4px;
    font-size: 16.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.005em;
  }

  .card-header p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---------- Form ---------- */
  .field {
    margin-bottom: 18px;
  }

  .field:last-child {
    margin-bottom: 0;
  }

  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 7px;
  }

  .field .hint {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 400;
    margin-left: 6px;
  }

  .field input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-tint);
  }

  .field input:disabled {
    background: var(--bg);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .field input.skeleton-input {
    color: transparent;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
  }

  .save-btn {
    padding: 11px 22px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .save-btn:hover {
    background: var(--teal-dark);
  }

  .save-btn:active {
    transform: scale(0.98);
  }

  .save-btn:disabled {
    background: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .save-status {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .save-status.ok {
    color: var(--teal-dark);
  }

  .save-status.err {
    color: var(--chili);
  }

  /* ---------- Banners ---------- */
  .banner {
    padding: 13px 18px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 22px;
    display: none;
  }

  .banner.show {
    display: block;
  }

  .banner.error {
    background: var(--chili-tint);
    border: 1px solid rgba(200, 85, 61, 0.25);
    color: var(--chili);
  }

  .banner.success {
    background: var(--teal-tint);
    border: 1px solid rgba(15, 110, 110, 0.25);
    color: var(--teal-dark);
  }

  /* ---------- Skeleton ---------- */
  .skeleton {
    background: linear-gradient(90deg, #eeece5 25%, #e2dfd5 37%, #eeece5 63%);
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
    border-radius: 6px;
    height: 14px;
    width: 60%;
  }

  @keyframes skeleton-loading {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  @media (max-width: 600px) {
    .field-row {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10L12 4L20 10V19C20 19.5523 19.5523 20 19 20H5C4.44772 20 4 19.5523 4 19V10Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9 20V14H15V20" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Hawker Centre Portal</h1>
        <p class="sub">My Profile</p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="back-btn" id="backBtn">Back to dashboard</button>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="container">

    <div class="banner error" id="errorBanner"></div>
    <div class="banner success" id="successBanner"></div>

    <div class="greeting">
      <h2 id="greetingName">Your Profile</h2>
      <p>Update your personal information and password</p>
    </div>

    <!-- Profile information -->
    <form class="card" id="profileForm">
      <div class="card-header">
        <h3>Profile Information</h3>
        <p>These details are visible on your account and used for contact.</p>
      </div>

      <div class="field">
        <label for="fieldName">Full Name</label>
        <input type="text" id="fieldName" name="name" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fieldEmail">Email</label>
          <input type="email" id="fieldEmail" name="email" required>
        </div>

        <!-- Stall owners see a contact number field -->
        <div class="field" id="fieldContactNoWrap">
          <label for="fieldContactNo">Contact Number</label>
          <input type="text" id="fieldContactNo" name="contactNo" maxlength="8">
        </div>

        <!-- Operators see a contact person field instead -->
        <div class="field" id="fieldContactPersonWrap" style="display:none;">
          <label for="fieldContactPerson">Contact Person</label>
          <input type="text" id="fieldContactPerson" name="contactPerson">
        </div>
      </div>

      <!-- Stall owners only: NRIC is an identity field, shown but not editable -->
      <div class="field" id="fieldNricWrap">
        <label for="fieldNric">NRIC <span class="hint">Cannot be changed</span></label>
        <input type="text" id="fieldNric" name="nric" disabled>
      </div>

      <div class="form-actions">
        <button type="submit" class="save-btn" id="saveProfileBtn">Save changes</button>
        <span class="save-status" id="profileSaveStatus"></span>
      </div>
    </form>

    <!-- Change password -->
    <form class="card" id="passwordForm">
      <div class="card-header">
        <h3>Change Password</h3>
        <p>Leave these blank if you don't want to change your password.</p>
      </div>

      <div class="field">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="save-btn" id="savePasswordBtn">Update password</button>
        <span class="save-status" id="passwordSaveStatus"></span>
      </div>
    </form>

  </div>

  <script>
    // ---------------------------------------------------------------
    // CONFIG
    // Mirrors the same pattern as dashboard.html: JWT in localStorage,
    // userId/userType in sessionStorage, and a REST route shaped like
    // /api/:userType/get-profile/:id and /api/:userType/update-profile/:id.
    // These two endpoints don't exist in your backend yet - you'll need
    // to add them. Adjust the URLs below if you name them differently.
    // ---------------------------------------------------------------
    const API_BASE = 'http://localhost:3000/api';
    const jwtToken = localStorage.getItem('jwtToken');

    if (!jwtToken) {
      alert("Something went wrong...");
      window.location.href = '/login';
    }

    function getUserId() {
      return sessionStorage.getItem('userId');
    }

    function getUserType() {
      return sessionStorage.getItem('userType') || 'StallOwner';
    }

    function showBanner(el, message) {
      el.textContent = message;
      el.classList.add('show');
    }

    function hideBanners() {
      document.getElementById('errorBanner').classList.remove('show');
      document.getElementById('successBanner').classList.remove('show');
    }

    function setStatus(el, message, kind) {
      el.textContent = message;
      el.className = 'save-status' + (kind ? ' ' + kind : '');
    }

    // ---------------------------------------------------------------
    // LOAD PROFILE
    // Expects GET /api/:userType/get-profile/:id to return, for a
    // Stall Owner:
    //   { OwnerName, Email, OwnerContactNo, OwnerNRIC }
    // or for an Operator:
    //   { OperatorName, Email, ContactPerson }
    // ---------------------------------------------------------------
    async function loadProfile() {
      const id = getUserId();
      const userType = getUserType();
      const isOperator = userType === 'Operator';

      document.getElementById('fieldContactNoWrap').style.display = isOperator ? 'none' : 'block';
      document.getElementById('fieldContactPersonWrap').style.display = isOperator ? 'block' : 'none';
      document.getElementById('fieldNricWrap').style.display = isOperator ? 'none' : 'block';

      try {
        const response = await fetch(`${API_BASE}/${userType}/get-profile/${id}`, {
          headers: { 'Authorization': `Bearer ${jwtToken}` }
        });

        if (!response.ok) {
          throw new Error(`Could not load your profile (status ${response.status}).`);
        }

        const data = await response.json();

        document.getElementById('greetingName').textContent = isOperator
          ? (data.OperatorName || 'Your Profile')
          : (data.OwnerName || 'Your Profile');

        document.getElementById('fieldName').value = isOperator ? (data.OperatorName || '') : (data.OwnerName || '');
        document.getElementById('fieldEmail').value = data.Email || '';

        if (isOperator) {
          document.getElementById('fieldContactPerson').value = data.ContactPerson || '';
        } else {
          document.getElementById('fieldContactNo').value = data.OwnerContactNo || '';
          document.getElementById('fieldNric').value = data.OwnerNRIC || '';
        }

      } catch (error) {
        showBanner(document.getElementById('errorBanner'), error.message || 'Something went wrong loading your profile.');
      }
    }

    // ---------------------------------------------------------------
    // SAVE PROFILE
    // Sends PUT /api/:userType/update-profile/:id with a body shaped
    // like { name, email, contactNo } (Stall Owner) or
    // { name, email, contactPerson } (Operator). Adjust field names
    // to match whatever your controller/model actually expects.
    // ---------------------------------------------------------------
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideBanners();

      const id = getUserId();
      const userType = getUserType();
      const isOperator = userType === 'Operator';
      const btn = document.getElementById('saveProfileBtn');
      const status = document.getElementById('profileSaveStatus');

      const payload = {
        name: document.getElementById('fieldName').value.trim(),
        email: document.getElementById('fieldEmail').value.trim()
      };

      if (isOperator) {
        payload.contactPerson = document.getElementById('fieldContactPerson').value.trim();
      } else {
        payload.contactNo = document.getElementById('fieldContactNo').value.trim();
      }

      btn.disabled = true;
      setStatus(status, 'Saving...', '');

      try {
        const response = await fetch(`${API_BASE}/${userType}/update-profile/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${jwtToken}`
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Could not save your changes (status ${response.status}).`);
        }

        setStatus(status, 'Saved', 'ok');
        showBanner(document.getElementById('successBanner'), 'Your profile has been updated.');

      } catch (error) {
        setStatus(status, 'Not saved', 'err');
        showBanner(document.getElementById('errorBanner'), error.message || 'Something went wrong saving your profile.');
      } finally {
        btn.disabled = false;
      }
    });

    // ---------------------------------------------------------------
    // CHANGE PASSWORD
    // Sends PUT /api/:userType/update-password/:id with
    // { currentPassword, newPassword }. Your backend should verify
    // currentPassword before allowing the change.
    // ---------------------------------------------------------------
    document.getElementById('passwordForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideBanners();

      const id = getUserId();
      const userType = getUserType();
      const btn = document.getElementById('savePasswordBtn');
      const status = document.getElementById('passwordSaveStatus');

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!currentPassword || !newPassword || !confirmPassword) {
        setStatus(status, 'Fill in all fields', 'err');
        return;
      }

      if (newPassword !== confirmPassword) {
        setStatus(status, 'Passwords do not match', 'err');
        return;
      }

      if (newPassword.length < 8) {
        setStatus(status, 'Use at least 8 characters', 'err');
        return;
      }

      btn.disabled = true;
      setStatus(status, 'Saving...', '');

      try {
        const response = await fetch(`${API_BASE}/${userType}/update-password/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${jwtToken}`
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });

        if (!response.ok) {
          if (response.status === 401) {
            throw new Error('Current password is incorrect.');
          }
          throw new Error(`Could not update your password (status ${response.status}).`);
        }

        setStatus(status, 'Updated', 'ok');
        showBanner(document.getElementById('successBanner'), 'Your password has been changed.');
        document.getElementById('passwordForm').reset();

      } catch (error) {
        setStatus(status, 'Not updated', 'err');
        showBanner(document.getElementById('errorBanner'), error.message || 'Something went wrong updating your password.');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('backBtn').addEventListener('click', function() {
      window.location.href = '/dashboard';
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
      sessionStorage.clear();
      localStorage.removeItem('jwtToken');
      window.location.href = '/login';
    });

    loadProfile();
  </script>

</body>
</html>
